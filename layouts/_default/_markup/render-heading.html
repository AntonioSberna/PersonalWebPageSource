{{- /* Headings. In blog posts they get a "#" link that copies the address of the section (assets/js/main.js). */ -}}
<h{{ .Level }} id="{{ .Anchor }}"{{ with .Attributes.class }} class="{{ . }}"{{ end }}>{{ .Text }}
{{- if eq .Page.Section "blog" }}<a class="heading-anchor" href="#{{ .Anchor }}" aria-label="Link to this section" title="Copy link to this section">#</a>{{ end -}}
</h{{ .Level }}>
