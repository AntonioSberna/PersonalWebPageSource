{{ define "main" }}
<div class="page-header">
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </div>
</div>

<div class="pub-full-list">
  <div class="container">
    {{ with partial "news-published.html" . }}
    <div class="news-archive">
      {{ partial "news-list.html" (dict "items" . "limit" 0) }}
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
