{{ define "main" }}
<div class="page-header">
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </div>
</div>

<div class="pub-full-list">
  <div class="container">
    {{ with hugo.Data.news }}{{ with .items }}
    <div class="news-archive">
      {{ partial "news-list.html" (dict "items" . "limit" 0) }}
    </div>
    {{ end }}{{ end }}
  </div>
</div>
{{ end }}
